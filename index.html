<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thời khóa biểu Hưng &amp; Vy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f6f7fb;--panel:#fff;--ink:#1c2233;--mute:#6b7388;--line:#e3e6ef;--today:#eef3ff;
--h:#2563c9;--hb:#dce8fb;--ht:#12356f;--v:#0f8a9d;--vb:#d6f0f4;--vt:#0a4c58;--y:#e0457f;--yb:#fde0ec;--yt:#7d1642;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12141c;--panel:#1b1e29;--ink:#eceff7;--mute:#9aa2b8;--line:#2b3040;--today:#1f2638;
--hb:#1d3563;--ht:#cfe0ff;--vb:#134650;--vt:#c4eef5;--yb:#5a1f3a;--yt:#ffd5e6}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12141c;--panel:#1b1e29;--ink:#eceff7;--mute:#9aa2b8;--line:#2b3040;--today:#1f2638;
--hb:#1d3563;--ht:#cfe0ff;--vb:#134650;--vt:#c4eef5;--yb:#5a1f3a;--yt:#ffd5e6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:18px 14px 40px}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:13px;margin-top:2px}
.nav,.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--mute)}
button:focus-visible{outline:2px solid var(--h);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:8px;font-weight:500}
.pill i{width:12px;height:12px;border-radius:50%;display:inline-block}
.pill[aria-pressed="false"]{opacity:.45}
.pill[aria-pressed="false"] i{background:transparent!important;border:2px solid var(--mute)}
#tip{position:fixed;z-index:20;display:none;pointer-events:none;max-width:270px;background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.5;box-shadow:0 4px 16px rgba(0,0,0,.25)}#tip b{display:block;font-size:13px;margin-bottom:2px}#tip span{display:block}
select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
#label{font-weight:600;min-width:210px;text-align:center}
.cal{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.grid{display:grid;grid-template-columns:52px repeat(7,minmax(118px,1fr));min-width:880px}
.dh{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line);border-left:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.dh b{display:block;font-size:17px;font-weight:600}.dh span{color:var(--mute);font-size:12px}
.dh.today{background:var(--today)}.dh.today b{color:var(--h)}
.axis{position:relative;height:720px}
.axis span{position:absolute;right:7px;transform:translateY(-50%);font-size:11px;color:var(--mute)}
.col{position:relative;height:720px;border-left:1px solid var(--line);
background:repeating-linear-gradient(to bottom,transparent 0,transparent 47px,var(--line) 47px,var(--line) 48px)}
.col.today{background-color:var(--today)}
.ev{position:absolute;border-radius:7px;padding:3px 6px;overflow:hidden;font-size:12px;line-height:1.3;text-align:left;border:0;border-left:4px solid;cursor:pointer;width:auto}
.ev b{font-weight:600;display:block}.ev small{display:block;opacity:.85;font-size:11px}
.ev.h{background:var(--hb);color:var(--ht);border-color:var(--h)}
.ev.v{background:var(--vb);color:var(--vt);border-color:var(--v)}
.ev.y{background:var(--yb);color:var(--yt);border-color:var(--y)}
#detail{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-height:64px}
#detail h2{margin:0 0 4px;font-size:16px}#detail p{margin:2px 0;color:var(--mute)}
.empty{padding:26px;text-align:center;color:var(--mute)}
@media (max-width:600px){#label{min-width:0;flex:1 0 100%;order:-1}}
</style>
</head>
<body>
<div class="wrap">
<header>
 <div><h1>Thời khóa biểu Hưng &amp; Vy</h1><div class="sub">Xanh là lịch của Hưng (Bách khoa, VUS) · hồng là lịch của Vy (IUH)</div></div>
 <div class="who">
  <button class="pill" id="th" aria-pressed="true"><i style="background:var(--h)"></i>Hưng</button>
  <button class="pill" id="ty" aria-pressed="true"><i style="background:var(--y)"></i>Vy</button>
  <select id="grp" aria-label="Nhóm thực hành của Vy"><option value="">Vy: mọi nhóm thực hành</option><option value="1">Vy: nhóm 1</option><option value="2">Vy: nhóm 2</option><option value="3">Vy: nhóm 3</option></select>
 </div>
</header>
<header>
 <div class="nav"><button id="prev" aria-label="Tuần trước">‹ Trước</button><button id="today">Hôm nay</button><button id="next" aria-label="Tuần sau">Sau ›</button></div>
 <div id="label"></div>
 <button id="jump">Tới tuần có lịch tiếp theo</button>
</header>
<div class="cal"><div class="grid" id="grid"></div></div>
<div id="detail"><p>Chạm vào một ô lịch để xem giờ, phòng và giảng viên.</p></div>
</div>

// Giờ bắt đầu từng tiết của IUH (mỗi tiết 45 phút). Sửa tại đây nếu trường đổi giờ.
const IUH={1:"06:30",2:"07:15",3:"08:00",4:"09:00",5:"09:45",6:"10:30",7:"12:30",8:"13:15",9:"14:00",10:"15:00",11:"15:45",12:"16:30",13:"17:45",14:"18:30",15:"19:15"};
const m=t=>{const[a,b]=t.split(":");return +a*60+ +b};
const hm=n=>String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0");
const E=[];
DATA.ev.forEach(([w,d,s,e,t,r,x])=>E.push({w:w=="h"&&/Session/.test(t)?"v":w,d,s:m(s),e:m(e),t,r,x}));
DATA.vy.forEach(([d,p1,p2,t,k,g,gv,r])=>E.push({w:"y",g:k=="Thực hành"?g:"",d,s:m(IUH[p1]),e:m(IUH[p2])+45,t,r,x:[k,g&&"nhóm "+g,gv&&"GV "+gv,"tiết "+p1+"–"+p2].filter(Boolean).join(" · ")}));
const NAME={h:"Hưng · Bách khoa",v:"Hưng · VUS",y:"Vy · IUH"};
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const show={h:true,y:true};let mon=monday(new Date());
const T0=6*60,PX=0.8; // 48px / giờ
const DOW=["Thứ 2","Thứ 3","Thứ 4","Thứ 5","Thứ 6","Thứ 7","Chủ nhật"];
const $=id=>document.getElementById(id);
let GRP="";try{GRP=localStorage.getItem("grp")||""}catch(e){}
const vis=e=>show[e.w=="v"?"h":e.w]&&(e.w!="y"||!e.g||!GRP||e.g==GRP);
function lanes(list){list.sort((a,b)=>a.s-b.s||a.e-b.e);let out=[],cl=[],end=0;
 const flush=()=>{const n=Math.max(...cl.map(x=>x.l))+1;cl.forEach(x=>{x.n=n});out.push(...cl);cl=[]};
 for(const e of list){if(cl.length&&e.s>=end)flush();const used=cl.filter(x=>x.e>e.s).map(x=>x.l);let l=0;while(used.includes(l))l++;e.l=l;cl.push(e);end=cl.length==1?e.e:Math.max(end,e.e)}
 if(cl.length)flush();return out}
function render(){
 const days=[...Array(7)].map((_,i)=>{const d=new Date(mon);d.setDate(d.getDate()+i);return d});
 const sun=days[6],fm=d=>d.getDate()+"/"+(d.getMonth()+1);
 $("label").textContent=fm(days[0])+" – "+fm(sun)+"/"+sun.getFullYear();
 const td=iso(new Date());let html='<div class="dh" style="border-left:0"></div>';
 days.forEach((d,i)=>html+=`<div class="dh${iso(d)==td?" today":""}"><b>${d.getDate()}/${d.getMonth()+1}</b><span>${DOW[i]}</span></div>`);
 let ax="";for(let h=7;h<=21;h++)ax+=`<span style="top:${(h-6)*48}px">${h}:00</span>`;
 html+=`<div class="axis">${ax}</div>`;let any=0;
 days.forEach(d=>{const l=lanes(E.filter(e=>e.d==iso(d)&&vis(e)).map(e=>({...e})));any+=l.length;
  html+=`<div class="col${iso(d)==td?" today":""}">`+l.map(e=>{
   const top=(e.s-T0)*PX,h=Math.max((e.e-e.s)*PX-2,22),w=100/e.n;
   return `<button class="ev ${e.w}" style="top:${top}px;height:${h}px;left:calc(${e.l*w}% + 2px);width:calc(${w}% - 4px)" data-i="${E.indexOf(E.find(x=>x.d==e.d&&x.s==e.s&&x.t==e.t&&x.w==e.w))}"><b>${e.t}${e.g?" · N"+e.g:""}</b><small>${hm(e.s)}–${hm(e.e)}${e.r?" · "+e.r:""}</small></button>`}).join("")+"</div>"});
 $("grid").innerHTML=html;
 if(!any)$("detail").innerHTML='<div class="empty">Tuần này không có lịch cho người đang chọn.</div>';
}
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
function info(e){const o={},r=e.r||"";
 if(e.w=="y"){const m=r.match(/^([^\s(]+)\s*(?:\((.*)\))?/);if(m){o.room=m[1];if(m[2])o.unit=m[2];const b=m[1].match(/^[A-Za-z]+\d+/);if(b)o.b=b[0]}}
 else if(e.w=="h"&&r.includes("-")){o.room=r;o.b=r.slice(0,r.indexOf("-"));o.c="BK-CS1"}
 else if(e.w=="v"&&r.includes(" - ")){const p=r.split(" - ");o.room=p[0];o.c=p[1]}
 else if(r)o.room=r;
 return o}
const lines=e=>{const o=info(e);return [["Phòng",o.room],["Tòa",o.b],["Cơ sở",o.c],["Đơn vị",o.unit]].filter(a=>a[1]).map(a=>a[0]+": "+a[1]).concat((e.x||"").split(" · ").filter(Boolean))};
document.addEventListener("click",ev=>{const b=ev.target.closest(".ev");if(!b)return;const e=E[+b.dataset.i];
 $("detail").innerHTML=`<h2>${e.t}</h2><p>${NAME[e.w]} · ${hm(e.s)}–${hm(e.e)}</p>${lines(e).map(l=>`<p>${esc(l)}</p>`).join("")}`});
const go=n=>{mon.setDate(mon.getDate()+n);render()};
$("prev").onclick=()=>go(-7);$("next").onclick=()=>go(7);
$("today").onclick=()=>{mon=monday(new Date());render()};
$("jump").onclick=()=>{const cur=iso(new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+6));
 const n=E.filter(e=>vis(e)&&e.d>cur).sort((a,b)=>a.d<b.d?-1:1)[0];
 if(n){const[y,mo,d]=n.d.split("-");mon=monday(new Date(+y,mo-1,+d));render()}else $("detail").innerHTML='<div class="empty">Không còn buổi nào phía sau.</div>'};
[["th","h"],["ty","y"]].forEach(([id,k])=>$(id).onclick=()=>{show[k]=!show[k];$(id).setAttribute("aria-pressed",show[k]);render()});
const tip=document.createElement("div");tip.id="tip";document.body.appendChild(tip);
function place(x,y){const w=tip.offsetWidth,h=tip.offsetHeight;tip.style.left=Math.max(8,Math.min(x+14,innerWidth-w-8))+"px";tip.style.top=(y+16+h>innerHeight?y-h-12:y+16)+"px"}
document.addEventListener("mouseover",ev=>{const b=ev.target.closest(".ev");if(!b)return;const e=E[+b.dataset.i];
 tip.innerHTML="<b>"+esc(e.t)+"</b><span>"+hm(e.s)+"–"+hm(e.e)+" · "+NAME[e.w]+"</span>"+lines(e).map(l=>"<span>"+esc(l)+"</span>").join("");tip.style.display="block";place(ev.clientX,ev.clientY)});
document.addEventListener("mousemove",ev=>{if(tip.style.display=="block")place(ev.clientX,ev.clientY)});
document.addEventListener("mouseout",ev=>{if(ev.target.closest(".ev"))tip.style.display="none"});
$("grp").value=GRP;
$("grp").onchange=()=>{GRP=$("grp").value;try{localStorage.setItem("grp",GRP)}catch(e){}render()};
render();
